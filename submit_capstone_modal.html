<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">Submit Your Capstone Project</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Please fill out the form below to submit your project.</p>
        <div class="mb-3">
          <label for="myInput" class="form-label">Project Title</label>
          <input type="text" class="form-control" id="myInput" placeholder="Enter your project title">
        </div>
        <div class="mb-3">
          <label for="authorInput" class="form-label">Author(s)</label>
          <input type="text" class="form-control" id="authorInput" placeholder="e.g., John Doe, Jane Smith">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="yearInput" class="form-label">Year of Capstone</label>
            <select class="form-select" id="yearInput">
              <option selected>Select Year...</option>
              <!-- Years are populated by the script below -->
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="courseInput" class="form-label">Course</label>
            <select class="form-select" id="courseInput">
              <option selected>Select Course...</option>
              <option>Multimedia Arts</option>
              <option>Entertainment & Multimedia Computing</option>
              <option>Entrepreneurship</option>
              <option>Computer Science</option>
              <option>Information Systems</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label for="descriptionInput" class="form-label">Description</label>
          <textarea class="form-control" id="descriptionInput" rows="3" placeholder="Provide a brief description of your project."></textarea>
        </div>
        <div class="mb-3">
          <label for="documentationInput" class="form-label">Documentation of Capstone</label>
          <input class="form-control" type="file" id="documentationInput" accept=".pdf,.doc,.docx">
        </div>
        <div class="mb-3">
          <label for="imagesInput" class="form-label">Images of Capstone / Demo</label>
          <input class="form-control" type="file" id="imagesInput" multiple accept="image/*,video/*">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Submit</button>
      </div>
    </div>
  </div>
</div>

<script>
  const myModal = document.getElementById('staticBackdrop')
  const myInput = document.getElementById('myInput')

  myModal.addEventListener('shown.bs.modal', () => {
    myInput.focus()
  });

  // Dynamically populate the year dropdown
  const yearSelect = document.getElementById('yearInput');
  const currentYear = new Date().getFullYear();
  for (let year = currentYear; year >= 2010; year--) {
    yearSelect.add(new Option(year, year));
  }
</script>
